const today=new Date(2026,5,1);

function addYear(d){if(!d)return null;const dt=new Date(d);dt.setFullYear(dt.getFullYear()+1);return dt.toISOString().slice(0,10);}
function proximaActualizacion(inicio){if(!inicio)return null;let d=new Date(inicio);while(d<=today)d.setMonth(d.getMonth()+3);return d;}
function getEstado(p){if(!p.inquilino)return"libre";return new Date(p.fin)>=today?"activo":"vencido";}
function diffDays(d){if(!d)return null;return Math.ceil((new Date(d)-today)/(1000*60*60*24));}
function fmt(n){return n?"$"+n.toLocaleString("es-AR"):"-";}
function fmtDate(d){if(!d)return"-";const[y,m,day]=d.split("-");return`${day}/${m}/${y}`;}
function fmtDateObj(d){if(!d)return"-";return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;}

function StatusBadge({estado,fin}){
  const days=diffDays(fin);
  let color,label;
  if(estado==="libre"){color="#6b7280";label="🔘 Libre";}
  else if(estado==="vencido"){color="#dc2626";label="🔴 Vencido";}
  else if(days!==null&&days<=60){color="#d97706";label=`🟡 ${days}d`;}
  else{color="#16a34a";label="🟢 Activo";}
  return <span style={{background:color,color:"#fff",borderRadius:12,padding:"2px 10px",fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}>{label}</span>;
}

function DireccionCard({dir,props}){

  const vencidos=props.filter(p=>getEstado(p)==="vencido");
  const total=activos.reduce((s,p)=>s+p.cuotaActual,0);

    <div style={{background:"#fff",borderRadius:12,boxShadow:"0 1px 4px rgba(0,0,0,.08)",overflow:"hidden",marginBottom:12}}>
      <div onClick={()=>setOpen(o=>!o)} style={{padding:"14px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,borderBottom:open?"1px solid #f1f5f9":"none"}}>

}

function PagosView({props}){
  const[mes,setMes]=useState(5);
  const[anio,setAnio]=useState(2026);
  const[historial,setHistorial]=useState({});
  const key=(id,m,a)=>`${a}-${m}-${id}`;
  const toggle=id=>{const k=key(id,mes,anio);setHistorial(h=>({...h,[k]:h[k]==="pagado"?"pendiente":"pagado"}));};
  const activos=props.filter(p=>getEstado(p)==="activo");
  const pagados=activos.filter(p=>historial[key(p.id,mes,anio)]==="pagado");
  const mesesAnteriores=[];
  for(let i=1;i<=3;i++){
    let m=mes-i;let a=anio;
    if(m<0){m+=12;a--;}
    const pag=activos.filter(p=>historial[key(p.id,m,a)]==="pagado");
    if(pag.length>0)mesesAnteriores.push({mes:m,anio:a,count:pag.length,total:pag.reduce((s,p)=>s+p.cuotaActual,0)});
  }
  return(
    <div>
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:14,flexWrap:"wrap"}}>
        <select value={mes} onChange={e=>setMes(Number(e.target.value))} style={{padding:"6px 12px",borderRadius:8,border:"1px solid #cbd5e1",fontSize:14}}>
          {MESES.map((m,i)=><option key={i} value={i}>{m}</option>)}
        </select>
        <select value={anio} onChange={e=>setAnio(Number(e.target.value))} style={{padding:"6px 12px",borderRadius:8,border:"1px solid #cbd5e1",fontSize:14}}>
          {[2024,2025,2026,2027].map(y=><option key={y} value={y}>{y}</option>)}
        </select>
        <span style={{fontSize:13,color:"#64748b"}}>{pagados.length}/{activos.length} pagados</span>
      </div>
      <div style={{background:"#e2e8f0",borderRadius:8,height:8,marginBottom:14,overflow:"hidden"}}>
        <div style={{background:"#16a34a",height:"100%",width:`${activos.length?pagados.length/activos.length*100:0}%`,transition:"width .3s",borderRadius:8}}/>
      </div>
      {activos.map(p=>{
        const pagado=historial[key(p.id,mes,anio)]==="pagado";
        return(
          <div key={p.id} onClick={()=>toggle(p.id)} style={{display:"flex",alignItems:"center",gap:12,background:pagado?"#f0fdf4":"#fff",border:`1px solid ${pagado?"#86efac":"#e2e8f0"}`,borderRadius:10,padding:"10px 14px",cursor:"pointer",marginBottom:7,transition:"all .15s"}}>
            <div style={{width:24,height:24,borderRadius:"50%",background:pagado?"#16a34a":"#e2e8f0",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              {pagado&&<span style={{color:"#fff",fontSize:13}}>✓</span>}
            </div>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:14}}>{p.propiedad}</div>
              <div style={{fontSize:12,color:"#64748b"}}>{p.inquilino}{p.telefono?` · 📞${p.telefono}`:""}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontWeight:700,color:pagado?"#16a34a":"#2563eb",fontSize:14}}>{fmt(p.cuotaActual)}</div>
              {pagado&&<div style={{fontSize:10,color:"#16a34a"}}>✓ cobrado</div>}
            </div>
          </div>
        );
      })}
      <div style={{marginTop:8,padding:"12px 16px",background:"#f8fafc",borderRadius:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontWeight:600,color:"#64748b",fontSize:13}}>Total cobrado</div>
          <div style={{fontSize:11,color:"#94a3b8"}}>{MESES[mes]} {anio}</div>
        </div>
        <span style={{fontWeight:700,color:"#16a34a",fontSize:18}}>{fmt(pagados.reduce((s,p)=>s+p.cuotaActual,0))}</span>
      </div>
      {mesesAnteriores.length>0&&(
        <div style={{marginTop:10,padding:"10px 14px",background:"#fff",borderRadius:10,border:"1px solid #e2e8f0"}}>
          <div style={{fontSize:12,fontWeight:600,color:"#64748b",marginBottom:6}}>📋 Historial reciente</div>
          {mesesAnteriores.map(({mes:m,anio:a,count,total})=>(
            <div key={`${m}-${a}`} style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#475569",padding:"3px 0",borderBottom:"1px solid #f1f5f9"}}>
              <span>{MESES[m]} {a} — {count} pagos</span>
              <span style={{fontWeight:600,color:"#16a34a"}}>{fmt(total)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ICLCalculator({props}){
  const[icl,setIcl]=useState(10);
  const proximas=props.filter(p=>{
    const pa=proximaActualizacion(p.inicio);
    if(!pa)return false;
    return Math.ceil((pa-today)/(864e5))<=90;
  });
  return(
    <div style={{background:"#eff6ff",border:"1px solid #93c5fd",borderRadius:10,padding:14}}>
      <div style={{fontWeight:700,color:"#1d4ed8",marginBottom:10,fontSize:14}}>📈 Calculadora de actualización ICL</div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,flexWrap:"wrap"}}>
        <label style={{fontSize:13,color:"#1d4ed8"}}>% de aumento:</label>
        <input type="number" value={icl} onChange={e=>setIcl(Number(e.target.value))}
          style={{width:70,padding:"5px 8px",border:"1px solid #93c5fd",borderRadius:6,fontSize:14,fontWeight:700,color:"#1d4ed8",textAlign:"center"}}/>
        <span style={{fontSize:13,color:"#64748b"}}>próximas actualizaciones (90 días)</span>
      </div>
      {proximas.length===0&&<div style={{fontSize:13,color:"#64748b"}}>No hay actualizaciones en los próximos 90 días.</div>}
      {proximas.map(p=>{
        const pa=proximaActualizacion(p.inicio);
        const nuevo=Math.round(p.cuotaActual*(1+icl/100));
        const diff=nuevo-p.cuotaActual;
        return(
          <div key={p.id} style={{background:"#fff",borderRadius:8,padding:"10px 12px",marginBottom:8,border:"1px solid #bfdbfe"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:4}}>
              <div>
                <span style={{fontWeight:700,fontSize:13}}>{p.propiedad}</span>
                <span style={{fontSize:12,color:"#64748b",marginLeft:8}}>{p.inquilino}</span>
              </div>
              <span style={{fontSize:12,color:"#64748b"}}>📅 {fmtDateObj(pa)}</span>
            </div>
            <div style={{display:"flex",gap:12,marginTop:6,fontSize:13,flexWrap:"wrap"}}>
              <span style={{color:"#64748b"}}>Actual: <strong>{fmt(p.cuotaActual)}</strong></span>
              <span style={{color:"#16a34a"}}>→ Nuevo: <strong>{fmt(nuevo)}</strong></span>
              <span style={{color:"#2563eb"}}>+{fmt(diff)}</span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

const PASSWORD="dimar3182";

function Login({onOk}){
  const[pass,setPass]=useState("");
  const[error,setError]=useState(false);
  const intentar=()=>{
    if(pass===PASSWORD){onOk();}
    else{setError(true);setPass("");}
  };
  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#1e3a8a,#2563eb)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"#fff",borderRadius:16,padding:32,width:320,maxWidth:"95vw",boxShadow:"0 20px 60px rgba(0,0,0,.3)",textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:8}}>🏠</div>
        <div style={{fontSize:20,fontWeight:700,color:"#1e293b",marginBottom:4}}>Panel de Alquileres</div>
        <div style={{fontSize:13,color:"#64748b",marginBottom:24}}>Familia · Acceso privado</div>
        <input
          type="password"
          value={pass}
          onChange={e=>{setPass(e.target.value);setError(false);}}
          onKeyDown={e=>e.key==="Enter"&&intentar()}
          placeholder="Contraseña"
          style={{width:"100%",padding:"10px 14px",border:`1px solid ${error?"#dc2626":"#cbd5e1"}`,borderRadius:8,fontSize:15,marginBottom:8,boxSizing:"border-box",textAlign:"center",letterSpacing:4}}
        />
        {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:8}}>Contraseña incorrecta</div>}
        <button onClick={intentar} style={{width:"100%",background:"#2563eb",color:"#fff",border:"none",borderRadius:8,padding:"10px 0",fontWeight:700,cursor:"pointer",fontSize:15}}>Entrar</button>
      </div>
    </div>
  );
}

          {props.map(p=>{
            const estado=getEstado(p);const days=diffDays(p.fin);const pa=proximaActualizacion(p.inicio);

            if(estado==="vencido")bg="#fef2f2";

                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

  const totalMensual=activos.reduce((s,p)=>s+p.cuotaActual,0);
  const filtered=withEstado.filter(p=>
    p.propiedad.toLowerCase().includes(search.toLowerCase())||
    p.inquilino.toLowerCase().includes(search.toLowerCase())||
    (p.telefono||"").includes(search)||
    (p.dni||"").includes(search)
  );
  const ts=t=>({padding:"8px 12px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:600,fontSize:12,background:tab===t?"#2563eb":"#f1f5f9",color:tab===t?"#fff":"#374151"});

  return(
    <div style={{maxWidth:900,margin:"0 auto",padding:12}}>
      <div style={{background:"linear-gradient(135deg,#1e3a8a,#2563eb)",borderRadius:14,padding:"16px 20px",marginBottom:14,color:"#fff"}}>
        <div style={{fontSize:19,fontWeight:700}}>🏠 Panel de Alquileres</div>
        <div style={{fontSize:12,opacity:.8,marginTop:2}}>Familia · Junio 2026 · {fmt(totalMensual)}/mes</div>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
        {[["direcciones","📍 Direcciones"],["dashboard","📊 Dashboard"],["propiedades","🏘️ Propiedades"],["pagos","💰 Pagos"],["alertas","🔔 Alertas"]].map(([t,l])=>(
          <button key={t} style={ts(t)} onClick={()=>setTab(t)}>{l}</button>
        ))}
      </div>

      {tab==="direcciones"&&(
        <div>
          <div style={{fontSize:13,color:"#64748b",marginBottom:10}}>{dirs.length} direcciones · {props_data.length} unidades en total</div>
          {dirs.map(dir=><DireccionCard key={dir.id} dir={dir} props={withEstado.filter(p=>p.direccionId===dir.id)}/>)}
        </div>
      )}

      {tab==="dashboard"&&(
        <div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:10,marginBottom:14}}>
            {[[props_data.length,"Total","#2563eb","🏠"],[activos.length,"Activos","#16a34a","🟢"],[libres.length,"Libres","#6b7280","🔘"],[vencidos.length,"Vencidos","#dc2626","🔴"],[porVencer.length,"Por vencer","#d97706","🟡"]].map(([val,label,color,icon])=>(
              <div key={label} style={{background:"#fff",borderRadius:10,padding:"12px 14px",boxShadow:"0 1px 4px rgba(0,0,0,.08)"}}>
                <div style={{fontSize:20}}>{icon}</div>
                <div style={{fontSize:22,fontWeight:700,color,marginTop:4}}>{val}</div>
                <div style={{fontSize:11,color:"#64748b",marginTop:2}}>{label}</div>
              </div>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
            <div style={{background:"#fff",borderRadius:10,padding:14,boxShadow:"0 1px 4px rgba(0,0,0,.08)"}}>
              <div style={{fontSize:12,color:"#64748b",marginBottom:4}}>💵 Recaudación mensual</div>
              <div style={{fontSize:22,fontWeight:700,color:"#16a34a"}}>{fmt(totalMensual)}</div>
            </div>
            <div style={{background:"#fff",borderRadius:10,padding:14,boxShadow:"0 1px 4px rgba(0,0,0,.08)"}}>
              <div style={{fontSize:12,color:"#64748b",marginBottom:4}}>📅 Recaudación anual est.</div>
              <div style={{fontSize:22,fontWeight:700,color:"#2563eb"}}>{fmt(totalMensual*12)}</div>
            </div>
          </div>
          <div style={{background:"#fff",borderRadius:10,padding:14,boxShadow:"0 1px 4px rgba(0,0,0,.08)"}}>
            <div style={{fontWeight:600,marginBottom:10,fontSize:14}}>Resumen por dirección</div>
            {dirs.map(dir=>{
              const dp=withEstado.filter(p=>p.direccionId===dir.id);
              const da=dp.filter(p=>p.estado==="activo");
              const dl=dp.filter(p=>p.estado==="libre");
              return(
                <div key={dir.id} style={{padding:"10px 0",borderBottom:"1px solid #f1f5f9"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <span style={{fontWeight:600,fontSize:13}}>📍 {dir.nombre}</span>
                      <span style={{fontSize:12,color:"#94a3b8",marginLeft:8}}>{dp.length} unidades</span>
                    </div>
                    <span style={{fontWeight:700,color:"#16a34a",fontSize:13}}>{fmt(da.reduce((s,p)=>s+p.cuotaActual,0))}/mes</span>
                  </div>
                  <div style={{display:"flex",gap:8,marginTop:4}}>
                    <span style={{fontSize:11,color:"#16a34a"}}>🟢 {da.length} activos</span>
                    <span style={{fontSize:11,color:"#6b7280"}}>🔘 {dl.length} libres</span>
                    {dp.filter(p=>p.estado==="vencido").length>0&&<span style={{fontSize:11,color:"#dc2626"}}>🔴 {dp.filter(p=>p.estado==="vencido").length} vencidos</span>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {tab==="propiedades"&&(
        <div>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar en todas las direcciones..."
            style={{width:"100%",padding:"9px 14px",borderRadius:8,border:"1px solid #cbd5e1",fontSize:14,marginBottom:12}}/>
          {search ? (
            <div>
              <div style={{fontSize:12,color:"#94a3b8",marginBottom:8}}>{filtered.length} resultados en todas las direcciones</div>
              {filtered.map(p=>{
                const days=diffDays(p.fin);const pa=proximaActualizacion(p.inicio);
                const dir=dirs.find(d=>d.id===p.direccionId);
                let bg="#fff";
                if(p.estado==="vencido")bg="#fef2f2";
                else if(p.estado==="libre")bg="#f8fafc";
                else if(days!==null&&days<=60)bg="#fffbeb";
                return(
                  <div key={p.id} style={{background:bg,border:"1px solid #e2e8f0",borderRadius:10,padding:"11px 13px",marginBottom:8}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:5,flexWrap:"wrap",gap:5}}>
                      <span style={{fontWeight:700,fontSize:14}}>{p.propiedad}</span>
                      <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
                        {dir&&<span style={{fontSize:10,color:"#64748b",background:"#f1f5f9",borderRadius:5,padding:"2px 6px"}}>📍{dir.nombre}</span>}
                        <StatusBadge estado={p.estado} fin={p.fin}/>
                      </div>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"3px 10px",fontSize:12,color:"#64748b"}}>
                      <span>👤 {p.inquilino||"Sin inquilino"}</span>
                      <span>💵 {fmt(p.cuotaActual)}</span>
                      {p.telefono&&<span>📞 {p.telefono}</span>}
                      {p.dni&&<span>🪪 {p.dni}</span>}
                      <span>📅 Fin: {fmtDate(p.fin)}</span>
                      {p.inicio&&<span>🔄 Próx: {pa?fmtDateObj(pa):"—"}</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            dirs.map(dir=>{
              const propsDir=withEstado.filter(p=>p.direccionId===dir.id);
              return <DirPropCard key={dir.id} dir={dir} props={propsDir}/>;
            })
          )}
        </div>
      )}

      {tab==="pagos"&&<PagosView props={withEstado}/>}

      {tab==="alertas"&&(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {vencidos.length>0&&<div style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:10,padding:14}}>
            <div style={{fontWeight:700,color:"#dc2626",marginBottom:8}}>🔴 Contratos vencidos ({vencidos.length})</div>
            {vencidos.map(p=><div key={p.id} style={{fontSize:13,color:"#7f1d1d",padding:"4px 0",borderBottom:"1px solid #fee2e2"}}>
              <strong>{p.propiedad}</strong> — {p.inquilino} — venció {fmtDate(p.fin)}
              {p.telefono&&<span style={{color:"#2563eb",marginLeft:8}}>📞{p.telefono}</span>}
            </div>)}
          </div>}
          {porVencer.length>0&&<div style={{background:"#fffbeb",border:"1px solid #fcd34d",borderRadius:10,padding:14}}>
            <div style={{fontWeight:700,color:"#d97706",marginBottom:8}}>🟡 Vencen en 60 días ({porVencer.length})</div>
            {porVencer.map(p=><div key={p.id} style={{fontSize:13,color:"#92400e",padding:"4px 0"}}>
              <strong>{p.propiedad}</strong> — {p.inquilino} — {fmtDate(p.fin)} ({diffDays(p.fin)}d)
              {p.telefono&&<span style={{color:"#2563eb",marginLeft:8}}>📞{p.telefono}</span>}
            </div>)}
          </div>}
          <ICLCalculator props={activos}/>
          {libres.length>0&&<div style={{background:"#f8fafc",border:"1px solid #cbd5e1",borderRadius:10,padding:14}}>
            <div style={{fontWeight:700,color:"#475569",marginBottom:8}}>🔘 Libres ({libres.length})</div>
            {libres.map(p=><div key={p.id} style={{fontSize:13,color:"#64748b",padding:"4px 0"}}><strong>{p.propiedad}</strong></div>)}
          </div>}
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<AppConLogin/>);
</script>
</body>
</html>
